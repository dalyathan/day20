name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # replay-heldout checks out old commits
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run eval
      - run: npm run replay-heldout
      # The Postman collection's Day 20 folder, run with Newman against the app in replay mode (no keys needed).
      - name: Postman (Newman) against replay mode
        run: |
          REPLAY=1 PORT=3000 DB_FILE=/tmp/ci.sqlite node server.js &
          sleep 2
          npx --yes newman@6 run postman/Day20.postman_collection.json --folder "5. Day 20 API" --env-var app_url=http://localhost:3000
